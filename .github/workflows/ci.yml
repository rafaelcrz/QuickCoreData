name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_*.app/Contents/Developer

      - name: Get iPhone Simulator
        id: simulator
        run: |
          LINE=$(xcrun simctl list devices available | grep -E "iPhone (1[4-9]|[2-9][0-9]) " | head -1)
          DEVICE=$(echo "$LINE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$DEVICE" >> $GITHUB_OUTPUT
          echo "Using simulator: $LINE"

      - name: Build (iOS)
        run: |
          xcodebuild build-for-testing \
            -scheme QuickCoreData \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -quiet

      - name: Run Tests (iOS)
        run: |
          xcodebuild test-without-building \
            -scheme QuickCoreData \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
